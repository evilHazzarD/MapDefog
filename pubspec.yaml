name: mapdefog
description: Your city, hidden in mist. Walk to reveal it.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.2.1
  latlong2: ^0.10.1
  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  geolocator: ^14.0.2
  permission_handler: ^13.0.2
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.2
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  intl: ^0.20.2
  timezone: ^0.11.2
  package_info_plus: ^10.2.2
  animated_options_bar: ^0.1.3
  sqlite3: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.1
  build_runner: ^2.7.1
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: Alegreya
      fonts:
        - asset: assets/fonts/alegreya.ttf
    - family: AlegreyaSans
      fonts:
        - asset: assets/fonts/sans_regular.ttf
        - asset: assets/fonts/sans_medium.ttf
          weight: 500
        - asset: assets/fonts/sans_bold.ttf
          weight: 700
    - family: AlegreyaSC
      fonts:
        - asset: assets/fonts/sc_medium.ttf
          weight: 500
        - asset: assets/fonts/sc_bold.ttf
          weight: 700

# Icons come from assets/images/logo.svg: python3 tool/app_icon.py, then
# dart run flutter_launcher_icons.
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: assets/icon/adaptive_bg.png
  adaptive_icon_foreground: assets/icon/adaptive_fg.png
  adaptive_icon_monochrome: assets/icon/adaptive_mono.png
